<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Map</title>
  <meta name="description" content="A record of every class I've taken at Carnegie Mellon.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="./">Course&nbsp;Map</a>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>My classes at Carnegie Mellon</h1>
      <p class="lede">What I took, when I took it, and what I'd tell someone taking it next.</p>
      <dl class="stats" id="stats"></dl>
    </section>

    <section class="toolbar" aria-label="Filters">
      <input id="search" type="search" placeholder="Search by number, title or tag…" aria-label="Search courses">
      <select id="dept" aria-label="Department"><option value="">All departments</option></select>
      <select id="status" aria-label="Status">
        <option value="">Any status</option>
        <option value="completed">Completed</option>
        <option value="in-progress">In progress</option>
        <option value="planned">Planned</option>
      </select>
      <div class="segmented" role="group" aria-label="Layout">
        <button data-view="timeline" aria-pressed="true">By semester</button>
        <button data-view="dept" aria-pressed="false">By department</button>
      </div>
    </section>

    <div id="results"></div>
  </main>

  <footer class="site-footer wrap">
    Edit <code>data/courses.js</code> to add a class.
  </footer>

  <script src="data/courses.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/index.js"></script>
</body>
</html>
